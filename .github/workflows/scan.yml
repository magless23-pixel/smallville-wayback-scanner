name: Check Smallville Wayback URLs
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'URLs to check this run (1-50; test with 5)'
        required: true
        default: '5'
      delay:
        description: 'Seconds between successful requests (minimum 15)'
        required: true
        default: '20'
      retry_unverified:
        description: 'Retry previously failed URLs (true or false)'
        required: true
        default: 'false'
permissions:
  contents: write
concurrency:
  group: smallville-cdx-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check and checkpoint results
        run: |
          python scan.py --count '${{ inputs.count }}' --delay '${{ inputs.delay }}' ${{ inputs.retry_unverified == 'true' && '--retry-unverified' || '' }}
      - name: Commit progress into repository for the next run
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m 'Save Wayback scan progress'
            git push
          else
            echo 'No changed scan results'
          fi
      - name: Downloadable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-results-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
