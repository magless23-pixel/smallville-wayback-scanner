name: Check Smallville Wayback URLs

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Optional total URLs for this scan series (blank = all eligible)'
        required: false
        default: ''
        type: string
      delay:
        description: 'Seconds between requests (minimum 15)'
        required: true
        default: '40'
        type: string
      retry_unverified:
        description: 'Retry previously unverified URLs'
        required: true
        default: false
        type: boolean
      continuation:
        description: 'Internal: resume a saved scan queue (leave unchecked for manual runs)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: smallville-cdx-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh committed scan progress
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git checkout "$DEFAULT_BRANCH"
          git pull --ff-only origin "$DEFAULT_BRANCH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check and checkpoint results
        env:
          SCAN_COUNT: ${{ inputs.count }}
          SCAN_DELAY: ${{ inputs.delay || '40' }}
          RETRY_UNVERIFIED: ${{ inputs.retry_unverified }}
          CONTINUATION: ${{ inputs.continuation }}
        run: |
          args=(--delay "$SCAN_DELAY" --max-minutes 350)
          if [ "$CONTINUATION" = 'true' ]; then
            args+=(--continuation)
          else
            if [ -n "$SCAN_COUNT" ]; then
              args+=(--count "$SCAN_COUNT")
            fi
            if [ "$RETRY_UNVERIFIED" = 'true' ]; then
              args+=(--retry-unverified)
            fi
          fi
          python scan.py "${args[@]}"
      - name: Commit progress to default branch for next run
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d reports ]; then
            git add reports/
            if ! git diff --cached --quiet; then
              git commit -m 'Save Wayback scan progress'
              git push origin "HEAD:$DEFAULT_BRANCH"
            else
              echo 'No changed scan results'
            fi
          else
            echo 'No reports directory to commit'
          fi
      - name: Downloadable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-results-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
      - name: Automatically continue remaining URLs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if python - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path('reports/scan_control.json')
          if not path.exists():
              sys.exit(1)
          status = json.loads(path.read_text(encoding='utf-8'))
          print(f"Remaining selected URLs: {status['remaining_in_selection']}; auto-continue: {status['auto_continue']}")
          sys.exit(0 if status['auto_continue'] else 1)
          PY
          then
            echo 'Starting next GitHub Actions run to continue the saved queue.'
            gh workflow run scan.yml --ref "$DEFAULT_BRANCH" \
              -f continuation=true -f count='' -f delay='40' -f retry_unverified=false
          else
            echo 'Scan series finished, or automatic continuation not safe/needed.'
          fi
