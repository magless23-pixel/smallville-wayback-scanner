name: Check Smallville Wayback URLs

on:
  workflow_dispatch:
    inputs:
      delay:
        description: 'Seconds between requests (minimum 15)'
        required: true
        default: '40'
      retry_unverified:
        description: 'Retry previously failed URLs (true or false)'
        required: true
        default: 'false'

permissions:
  contents: write

concurrency:
  group: smallville-cdx-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh committed scan progress
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git checkout "$DEFAULT_BRANCH"
          git pull --ff-only origin "$DEFAULT_BRANCH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check and checkpoint results
        env:
          SCAN_DELAY: ${{ inputs.delay || '40' }}
          RETRY_UNVERIFIED: ${{ inputs.retry_unverified || 'false' }}
        run: |
          if [ "$RETRY_UNVERIFIED" = 'true' ]; then
            python scan.py --delay "$SCAN_DELAY" --retry-unverified
          else
            python scan.py --delay "$SCAN_DELAY"
          fi
      - name: Commit progress to default branch for next run
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d reports ]; then
            git add reports/
            if ! git diff --cached --quiet; then
              git commit -m 'Save Wayback scan progress'
              git push origin "HEAD:$DEFAULT_BRANCH"
            else
              echo 'No changed scan results'
            fi
          else
            echo 'No reports directory to commit'
          fi
      - name: Downloadable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-results-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
